name: Lint Check

on:
#   push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: my-resume/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./my-resume

      - name: Build site
        run: npm run build
        working-directory: ./my-resume
