name: Track dependency vulnerabilities

on:
  push:
    branches: [main]
    paths:
      - my-resume/package.json
      - my-resume/package-lock.json
      - my-resume/scripts/create-audit-issues.mjs
      - .github/workflows/dependency-issues.yml
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-vulnerability-issues
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Create tracking issues for vulnerabilities
        working-directory: my-resume
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/create-audit-issues.mjs
